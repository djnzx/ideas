name: CI

# Every commit on every branch. `branches: ['**']` matches nested names like
# `feature/foo` while leaving tag pushes alone.
on:
  push:
    branches: ['**']

# A newer commit on the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      # sbt is no longer preinstalled on the runners; the version itself comes
      # from project/build.properties (2.0.8).
      - uses: sbt/setup-sbt@v1

      # `validate` = full test suite + scalafmt checks, in that order.
      # (Plain `test` would be wrong here: in sbt 2 it means `testQuick`.)
      - run: sbt -batch -v validate
