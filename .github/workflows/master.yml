name: master-ci

# Everything that lands on master, however it got there:
#
#   1. merged PR from a branch named exactly X.Y.Z -> validate + publish + tag
#   2. merged PR from any other branch             -> validate
#   3. direct push                                 -> validate
#
# A merge emits both `pull_request: closed` and `push`. Listening only for `push` keeps
# this to one run. Because that event has no PR payload, step 1 asks GitHub which merged
# PR introduced this commit and gets the source branch from that response.
#
# ---------------------------------------------------------------------------------
# HOW DATA MOVES BETWEEN STEPS
#
#   env:            values handed TO a step, readable as shell variables ($EVENT)
#   $GITHUB_OUTPUT  a file a step appends `key=value` lines to
#   steps.<id>.outputs.<key>
#                   how every LATER step reads those values
#   if:             a step runs only when this is true; skipped steps are not failures
#
# Only step 1 has an `id`, because it is the only step other steps read from.
# ---------------------------------------------------------------------------------

on:
  push:
    branches: [master]

# Serialise runs so two merges cannot publish out of order. Never cancel:
# a cancelled run could leave a tag without an artifact.
concurrency:
  group: master
  cancel-in-progress: false

# Declaring this block at all sets EVERY unlisted scope to `none` -- it is deny-by-default,
# not "add these on top of the defaults".
#
# The cache service issues its own runtime token, independently of this block. A `push`
# to master is allowed to save the sbt/coursier caches; `actions: write` is neither
# needed nor sufficient for cache writes.
permissions:
  contents: write # push the tag
  packages: write # publish to GitHub Packages
  pull-requests: read # find the PR that introduced this pushed commit

jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      # === STEP 1 =====================================================================
      # Decides whether this run is a release. Every gated step below reads its output.
      #
      #   IN   SHA     pushed commit (github.sha)
      #        API     GitHub's PR associated-with-commit endpoint
      #   OUT  release "true" | "false"              -> gates steps 3, 7, 8, 9
      #        version "X.Y.Z"                       -> only written when release=true
      #        branch / fork                         -> needed to clean up a release branch
      #
      # `id: step1` is what makes these readable later as steps.step1.outputs.release .
      # The id is an arbitrary handle, not a keyword; it matches the STEP banners above.
      - name: Discover release data
        id: step1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" | jq -c '
            [.[] | select(.merged_at != null and .base.ref == "master")]
            | if length == 0 then empty
              elif length == 1 then .[0]
              else error("more than one merged PR is associated with this commit")
              end
          ')"

          if [[ -z "$pr" ]]; then
            echo "Direct push to master - validating only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="$(jq -r '.head.ref' <<<"$pr")"
          fork="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "fork=$fork" >> "$GITHUB_OUTPUT"

          if [[ ! "$branch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Merged from '$branch', which is not X.Y.Z - validating only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merged from '$branch' - releasing as v$branch"
            echo "release=true"    >> "$GITHUB_OUTPUT"
            echo "version=$branch" >> "$GITHUB_OUTPUT"
          fi

      # === STEP 2 =====================================================================
      # Puts the source code on the runner. Nothing before this can read a file.
      #
      #   IN   ref          the pushed commit (github.sha)
      #        fetch-depth  0 means full history AND tags -- step 3 needs the tags.
      #   OUT  the working directory
      - name: Check out the commit to build
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Validate and tag the actual merge commit, not whatever master points at later.
          ref: ${{ github.sha }}

      # === STEP 3 ===================================================== release only ==
      # Cheap, and before a build is spent on something that cannot be published.
      #
      #   IN   TAG   "v" + version from step 1
      #        tags  fetched by step 2
      #   OUT  nothing. Exits non-zero to FAIL THE WHOLE JOB if the tag already exists,
      #        which stops steps 4-9 from running.
      - name: Refuse to re-release an existing tag
        if: steps.step1.outputs.release == 'true'
        env:
          TAG: v${{ steps.step1.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      # === STEP 4 =====================================================================
      #   IN   distribution / java-version  which JDK to install
      #        cache: sbt                   restores ~/.sbt and the coursier cache
      #   OUT  a JDK on PATH, plus a warm dependency cache for steps 6 and 7
      - name: Install the JDK and restore the sbt cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      # === STEP 5 =====================================================================
      #   IN   nothing -- the sbt version comes from project/build.properties (2.0.8)
      #   OUT  `sbt` on PATH
      - name: Install sbt
        uses: sbt/setup-sbt@v1

      # === STEP 6 ================================================== always, all cases ==
      # The only step that runs for every push: a direct push or a non-release merge.
      #
      #   IN   RELEASE_VERSION  version from step 1; EMPTY in validation-only cases, which
      #                         build.sbt treats as absent and lets sbt-dynver derive one
      #                         from git instead (e.g. 1.0.4+1-a860b45)
      #        GITHUB_TOKEN     credentials for GitHub Packages
      #        source           from step 2, tools from steps 4 and 5
      #   OUT  nothing readable. Fails the job on unformatted code or a failing test.
      #        Side effect that matters: leaves an sbt server holding compiled classes.
      #
      # NOTE: this env block is the one that actually counts, even for step 7. sbt 2 runs
      # a background server that snapshots the environment when it STARTS, and later
      # `sbt` invocations are thin clients reusing it -- so whatever is set here is what
      # the build reads for the rest of the job.
      #
      # Removing RELEASE_VERSION from this step therefore breaks the release, even though
      # step 7 sets it: measured, the publish then fails with
      #   refusing to publish 1.0.4+0-1c2c7bdc+... as a release -- RELEASE_VERSION is not set
      # The variable is not needed to validate; it is needed here so step 7 inherits it.
      - name: Validate
        env:
          RELEASE_VERSION: ${{ steps.step1.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch -v validate

      # === STEP 7 ===================================================== release only ==
      #   IN   the compiled classes still held by step 6's sbt server, so NO RECOMPILE
      #        RELEASE_VERSION / GITHUB_TOKEN -- see the note below
      #   OUT  the artifact, published to GitHub Packages
      #
      # The env: block below is normally DEAD. This step is a thin client attached to the
      # server step 6 started, and that server already snapshotted its own environment --
      # measured: with the server started without RELEASE_VERSION, a client exporting it
      # is ignored and the build still reports the git-derived version.
      #
      # It is kept anyway, because it is the only thing that makes this step correct on
      # its own. If the server ever is not already running -- it died, someone inserted a
      # `sbt shutdown`, a future sbt drops the thin-client reuse, or this step moves to
      # another job -- then sbt starts a fresh server here and reads exactly these values.
      # Deleting them would leave a step that works only by relying on its neighbour.
      #
      # Publish before tagging: a tag pointing at an unpublished commit is worse than
      # a published artifact whose tag needs re-adding by hand.
      # `release`, not `publish`: it refuses to publish unless RELEASE_VERSION is set,
      # so a missing variable fails loudly instead of shipping a dynver snapshot string.
      - name: Publish to GitHub Packages
        if: steps.step1.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.step1.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_ACTOR is set by GitHub already
        run: sbt -batch -v release

      # === STEP 8 ===================================================== release only ==
      #   IN   TAG  "v" + version from step 1
      #   OUT  an annotated tag pushed to origin, on the commit step 2 checked out
      #
      # The name is static on purpose: an interpolated name renders as a bare "Tag v"
      # in the log whenever this step is skipped, since version is empty then. The
      # actual tag is echoed by the step instead.
      - name: Tag the release
        if: steps.step1.outputs.release == 'true'
        env:
          TAG: v${{ steps.step1.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"

      # === STEP 9 ===================================================== release only ==
      #   IN   BRANCH  the merged PR's source branch
      #        FORK    which repo that branch lives in -- a fork's branch is not ours
      #        REPO / GH_TOKEN  target and credentials for the delete call
      #   OUT  the release branch removed from origin
      #
      # Last step on purpose: steps fail the job on first error, so the branch is only
      # removed once validate, publish and tag have all succeeded.
      - name: Delete the release branch
        if: steps.step1.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.step1.outputs.branch }}
          FORK: ${{ steps.step1.outputs.fork }}
        run: |
          if [[ "$FORK" != "$REPO" ]]; then
            echo "Head branch lives in $FORK, not $REPO - leaving it alone."
          elif gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH"
          else
            echo "Branch $BRANCH is already gone (repo auto-delete may be on)."
          fi
