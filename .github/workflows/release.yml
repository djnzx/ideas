name: Release

# Fires when a PR into master is merged, and covers two cases:
#
#   - branch named exactly X.Y.Z -> validate, publish, tag, delete the branch
#   - any other branch name      -> validate only
#
# The validate step is therefore NOT gated on the branch name. master is excluded from
# scala-ci.yml's push trigger, so this job is the only thing that ever sees a merge
# commit -- gating validation here would leave ordinary merges untested.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write # push the tag
  packages: write # publish to GitHub Packages

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Is the source branch X.Y.Z?
        id: ver
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch '$BRANCH' is not X.Y.Z - validating only, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $BRANCH as v$BRANCH"
            echo "release=true"        >> "$GITHUB_OUTPUT"
            echo "version=$BRANCH"     >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          # Validate and tag the actual merge commit, not whatever master points at later.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Cheap, and before a build is spent on something that cannot be published.
      - name: Refuse to re-release an existing tag
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # NOTE: sbt 2 runs a background server that captures the environment when it
      # starts, and later `sbt` invocations are thin clients that reuse it. This step
      # therefore needs the same env as the publish step, or the server comes up with
      # no RELEASE_VERSION and no credentials.
      #
      # On a non-release merge RELEASE_VERSION is the empty string; build.sbt treats
      # empty as absent and falls back to the snapshot version.
      - name: Validate
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch -v validate

      # No recompile happens here: the sbt server started by Validate still holds the
      # compiled classes, so `release` only has to publish them.
      #
      # Publish before tagging: a tag pointing at an unpublished commit is worse
      # than a published artifact whose tag needs re-adding by hand.
      # `release`, not `publish`: it refuses to push a snapshot, so a missing
      # RELEASE_VERSION fails loudly instead of publishing 0.1.0-SNAPSHOT.
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_ACTOR is set by GitHub already
        run: sbt -batch -v release

      - name: Tag v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # Last step on purpose: steps fail the job on first error, so the branch is
      # only removed once validate, publish and tag have all succeeded.
      - name: Delete the release branch
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          FORK: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$FORK" != "$REPO" ]]; then
            echo "Head branch lives in $FORK, not $REPO - leaving it alone."
          elif gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH"
          else
            echo "Branch $BRANCH is already gone (repo auto-delete may be on)."
          fi
