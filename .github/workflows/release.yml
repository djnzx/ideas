name: Release

# Fires when a PR is merged. Only branches named exactly X.Y.Z release;
# everything else merges normally and this job no-ops.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write # push the tag
  packages: write # publish to GitHub Packages

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Is the source branch X.Y.Z?
        id: ver
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch '$BRANCH' is not X.Y.Z - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $BRANCH as v$BRANCH"
            echo "release=true"        >> "$GITHUB_OUTPUT"
            echo "version=$BRANCH"     >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.ver.outputs.release == 'true'
        with:
          # Tag the actual merge commit, not whatever master points at later.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Refuse to re-release an existing tag
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      - uses: actions/setup-java@v6
        if: steps.ver.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@v1
        if: steps.ver.outputs.release == 'true'

      # NOTE: sbt 2 runs a background server that captures the environment when it
      # starts, and later `sbt` invocations are thin clients that reuse it. The
      # first sbt step therefore needs the same env as the publish step, or the
      # server comes up with no RELEASE_VERSION and no credentials.
      - name: Validate
        if: steps.ver.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch -v validate

      # Publish before tagging: a tag pointing at an unpublished commit is worse
      # than a published artifact whose tag needs re-adding by hand.
      # `release`, not `publish`: it refuses to push a snapshot, so a missing
      # RELEASE_VERSION fails loudly instead of publishing 0.1.0-SNAPSHOT.
      - name: Publish to GitHub Packages
        if: steps.ver.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_ACTOR is set by GitHub already
        run: sbt -batch -v release

      - name: Tag v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
