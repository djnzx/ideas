name: CI

# Every commit on every branch except master. `branches-ignore` matches nested names
# like `feature/foo` while leaving tag pushes alone.
#
# master is excluded deliberately: it only changes through merged PRs, and release.yml
# validates every merge commit. Without this exclusion the same tree gets compiled and
# tested twice in parallel on every merge -- once here, once there.
on:
  push:
    branches-ignore: ['master']

# A newer commit on the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      # sbt is no longer preinstalled on the runners; the version itself comes
      # from project/build.properties (2.0.8).
      - uses: sbt/setup-sbt@v1

      # `validate` = scalafmt checks + full test suite, in that order.
      - run: sbt -batch -v validate
